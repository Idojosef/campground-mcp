[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campground-mcp"
version = "0.1.0"
description = "MCP server for searching, comparing, and monitoring campgrounds across RV Life and Recreation.gov"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
campground-mcp = "campground_mcp.server:main"
